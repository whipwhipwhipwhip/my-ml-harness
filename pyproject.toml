[project]
name = "ml_harness"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.4.10",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pandas-gbq>=0.31.0",
    "tqdm>=4.67.1",
    "scikit-learn",
    "graphviz",
    "torch",
    "torchtyping",
    "hypothesis",
    "pytest",
    "chalk-diagrams",
    "optuna",
    "dacite",
    "tokenizers"
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]