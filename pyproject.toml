[project]
name = "ml_harness"
version = "0.0.4"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "torch",
    "dacite",
    # the local package, not HuggingFace's
    "tokenizers",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv.sources]
tokenizers = {git = "ssh://git@github.com/whipwhipwhipwhip/my-tokenizers.git", tag="v0.0.2" }
